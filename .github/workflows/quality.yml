name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run build
      - name: Check generated assets
        run: |
          test -f dist/assets/img/yanottama-384-*.webp
          test -f dist/assets/img/yanottama-768-*.webp
          test -f dist/assets/img/yanottama-1200-*.webp
